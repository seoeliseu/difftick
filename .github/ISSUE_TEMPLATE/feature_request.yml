name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DiffTick to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: markdown
    attributes:
      value: |
        DiffTick deliberately has no backend, telemetry, tokens or extra permissions. Ideas that need any of those (for example the authenticated GraphQL mode on the roadmap) are welcome, but will be discussed first.
